<!DOCTYPE html>
<html lang="es">
<head>
  <base href="/">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta
    name="description"
    content="SnackUp permite consultar menús y realizar pedidos en la cafetería universitaria."
  >
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta name="theme-color" content="#4a54df">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SnackUp">

  <title>SnackUp UTSJR</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <style>
    html,
    body {
      height: 100%;
    }

    body {
      align-items: center;
      background: linear-gradient(180deg, #4a54df, #c942ba);
      display: flex;
      justify-content: center;
      margin: 0;
    }

    .splash {
      animation: pulse 2s infinite ease-in-out;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .splash img {
      height: auto;
      width: 150px;
    }

    .splash p {
      margin: 12px 0 0;
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .82;
        transform: scale(1.04);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash {
        animation: none;
      }
    }
  </style>

  <script>
    function removeSplashFromWeb() {
      document.getElementById('splash')?.remove();
      document.body.style.background = 'transparent';
      document.body.style.display = 'block';
    }
  </script>
</head>
<body>
  <main id="splash" class="splash" aria-live="polite" aria-busy="true">
    <img src="logo_carga.png" alt="Logotipo de SnackUp">
    <p>Cargando SnackUp…</p>
  </main>

  <noscript>
    SnackUp necesita JavaScript habilitado para funcionar.
  </noscript>

  <script src="main.dart.js" defer></script>
</body>
</html>
